name: Build plugins
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build SafeZonePro
        run: mvn -B clean package
        working-directory: SafeZonePro
      - name: Build CombatTag
        run: mvn -B clean package
        working-directory: CombatTag
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            SafeZonePro/target/SafeZonePro-1.0.0.jar
            CombatTag/target/CombatTag-1.0.0.jar
